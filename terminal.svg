<svg width="800" height="200" viewBox="0 0 800 200" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
        .bg { fill: #000000; }
        .border { stroke: #DF6513; stroke-width: 1; stroke-opacity: 0.5; }
        .text { font-family: 'Courier Prime, monospace'; font-size: 18px; fill: #FFFFFF; }
        .prompt { fill: #DF6513; font-weight: 700; }
        .cursor { fill: #059D00; animation: blink 1s step-end infinite; }
        .typing1 { stroke: transparent; animation: typing1 2s steps(40, end) forwards; white-space: nowrap; overflow: hidden; display: inline-block; width: 0; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes typing1 { from { width: 0; } to { width: 100%; } }
    </style>
    
    <!-- Window -->
    <rect x="5" y="5" width="790" height="190" rx="6" class="bg border" />
    <!-- Top Bar -->
    <rect x="5" y="5" width="790" height="30" rx="6" fill="#111" class="border" />
    <circle cx="20" cy="20" r="6" fill="#FF5F56" />
    <circle cx="40" cy="20" r="6" fill="#FFBD2E" />
    <circle cx="60" cy="20" r="6" fill="#27C93F" />
    <text x="350" y="22" class="text" style="font-size: 14px; opacity: 0.5;">bash - actsurance</text>

    <!-- Terminal Content -->
    <g transform="translate(20, 65)">
        <text y="0" class="text">
            <tspan class="prompt">ahmad@secure-node:~$</tspan> whoami
        </text>
        <text y="30" class="text" style="fill: #059D00;">Ahmad Kaleem Bhatti | AI Security Engineer</text>
        <text y="70" class="text">
            <tspan class="prompt">ahmad@secure-node:~$</tspan> cat current_mission.txt
        </text>
        <text y="100" class="text" style="fill: #059D00;">Building deterministic control layers for autonomous agents.</text>
        <rect x="540" y="85" width="10" height="18" class="cursor" />
    </g>
</svg>