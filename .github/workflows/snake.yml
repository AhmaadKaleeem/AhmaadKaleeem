name: snake

on:
  schedule:
    # runs at midnight UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVG from real contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AhmaadKaleeem
          outputs: |
            dist/snake-light.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B00&color_dots[0]=#1E1E1E&color_dots[1]=#22C55E&color_dots[2]=#22C55E&color_dots[3]=#16A34A&color_dots[4]=#15803D

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

