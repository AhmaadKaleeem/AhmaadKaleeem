name: snake

on:
  schedule:
    # runs at midnight UTC every day
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Generate snake SVG from real contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AhmaadKaleeem
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#FF6B00
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF6B00&color_dots[0]=#1E1E1E&color_dots[1]=#22C55E&color_dots[2]=#22C55E&color_dots[3]=#16A34A&color_dots[4]=#15803D

      - name: Post-process SVGs (Slow down and clip columns)
        run: |
          node -e "
            const fs = require('fs');
            const files = ['dist/snake-light.svg', 'dist/snake-dark.svg'];
            for (const file of files) {
              if (!fs.existsSync(file)) continue;
              let content = fs.readFileSync(file, 'utf8');
              
              // Slow down by replacing durations like 5s with 10s
              content = content.replace(/(\d+(\.\d+)?)s/g, (match, p1) => {
                return (parseFloat(p1) * 2) + 's';
              });
              
              // Clip the rightmost 2 columns (16px per column = 32px)
              content = content.replace(/viewBox=\"0 0 (\d+) (\d+)\"/, (match, w, h) => {
                return \`viewBox=\"0 0 \${parseInt(w) - 32} \${h}\"\`;
              });
              content = content.replace(/<svg[^>]+width=\"(\d+)\"/, (match, w) => {
                return match.replace(\`width=\"\${w}\"\`, \`width=\"\${parseInt(w) - 32}\"\`);
              });
              
              fs.writeFileSync(file, content);
            }
          "

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

