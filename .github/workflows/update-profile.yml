name: Generate Profile SVGs

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  push:
    branches: [ "main" ] # Runs when you push changes to main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Environment (Python)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run generation script
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generate_svgs.py 

      - name: Generate streak stats (Dark)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=AhmaadKaleeem&theme=dark&hide_border=true&background=0D1117&ring=FF6B00&fire=FF6B00
          path: streak-dark.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Generate streak stats (Light)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=AhmaadKaleeem&theme=default&hide_border=true&background=F6F8FA&ring=FF6B00&fire=FF6B00
          path: streak-light.svg
          token: ${{ secrets.GH_TOKEN }}

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/ streak-dark.svg streak-light.svg
          git diff-index --quiet HEAD || git commit -m "Auto-update profile graphics"
          git pull --rebase
          git push
