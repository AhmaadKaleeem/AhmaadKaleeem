<svg width="800" height="150" viewBox="0 0 800 150" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
        .name {
            font-family: 'Courier Prime, monospace';
            font-weight: 700;
            font-size: 64px;
            fill: #FFFFFF;
            opacity: 0;
            animation: textReveal 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
            text-anchor: middle;
        }
        .glow {
            fill: #DF6513;
            filter: blur(12px);
            opacity: 0.3;
            animation: pulseGlow 4s infinite alternate;
        }
        
        @keyframes textReveal {
            0% { opacity: 0; transform: translateY(20px); letter-spacing: -10px; filter: blur(8px); }
            100% { opacity: 1; transform: translateY(0); letter-spacing: -2px; filter: blur(0px); }
        }
        @keyframes pulseGlow {
            0% { opacity: 0.1; transform: scale(0.9); }
            100% { opacity: 0.5; transform: scale(1.1); }
        }
    </style>
    
    <rect width="800" height="150" fill="#000000" />
    
    <!-- Background Glow -->
    <ellipse cx="400" cy="75" rx="200" ry="40" class="glow" />
    
    <!-- Title -->
    <text x="400" y="95" class="name">Ahmad Kaleem Bhatti</text>
</svg>