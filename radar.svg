<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');
        .radar-bg { fill: #18181B; rx: 16px; }
        .grid-line { stroke: #A78BFA; stroke-width: 1; fill: none; opacity: 0.2; }
        .axis-line { stroke: #A78BFA; stroke-width: 1; opacity: 0.3; }
        .radar-poly { fill: #F472B6; fill-opacity: 0.2; stroke: #F472B6; stroke-width: 3; animation: radarPulse 3s infinite alternate; stroke-linejoin: round; }
        .node { fill: #F472B6; }
        .label { font-family: 'Nunito, sans-serif'; font-size: 14px; fill: #FAFAFA; font-weight: 800; }
        .title { font-family: 'Nunito, sans-serif'; font-size: 24px; font-weight: 800; fill: #A78BFA; }
        @keyframes radarPulse { 0% { filter: drop-shadow(0 0 5px #F472B6); transform: scale(1); transform-origin: 400px 200px; } 100% { filter: drop-shadow(0 0 15px #F472B6); transform: scale(1.02); transform-origin: 400px 200px; } }
        .axis-group { opacity: 0; animation: fadeIn 1s forwards 0.5s; }
        .radar-poly { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawRadar 1.5s forwards 1s, radarPulse 3s infinite alternate 2.5s; }
        @keyframes drawRadar { to { stroke-dashoffset: 0; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
