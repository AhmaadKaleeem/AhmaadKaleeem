<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap');
        .radar-bg { fill: #000000; }
        .grid-line { stroke: rgba(255, 255, 255, 0.1); stroke-width: 1; fill: none; }
        .axis-line { stroke: rgba(255, 255, 255, 0.2); stroke-width: 1; }
        .radar-poly {
            fill: rgba(5, 157, 0, 0.3);
            stroke: #059D00;
            stroke-width: 2;
            animation: radarPulse 3s infinite alternate;
        }
        .node { fill: #059D00; }
        .label { font-family: 'Courier Prime, monospace'; font-size: 13px; fill: #FFFFFF; font-weight: bold; }
        .title { font-family: 'Courier Prime, monospace'; font-size: 20px; font-weight: bold; fill: #DF6513; }
        
        @keyframes radarPulse {
            0% { filter: drop-shadow(0 0 5px #059D00); transform: scale(1); transform-origin: 400px 200px; }
            100% { filter: drop-shadow(0 0 15px #059D00); transform: scale(1.02); transform-origin: 400px 200px; }
        }
        
        .axis-group { opacity: 0; animation: fadeIn 1s forwards 0.5s; }
        .radar-poly { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawRadar 1.5s forwards 1s, radarPulse 3s infinite alternate 2.5s; }
        
        @keyframes drawRadar { to { stroke-dashoffset: 0; } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
    
    <rect width="800" height="400" class="radar-bg" />
    <text x="30" y="40" class="title">&gt; SKILL_RADAR.exe</text>
    
